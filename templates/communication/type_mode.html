{% extends 'communication/base_aac.html' %}
{% load static %}

{% block title %}Type to Speak - Communication{% endblock %}
{% block page_title %}Type to Speak{% endblock %}

{% block content %}
<div style="margin-bottom: 1rem;">
    <a href="{% url 'communication:dashboard' %}" class="aac-back-btn" style="display: inline-flex;">
        <span class="material-icons">arrow_back</span>
        Back to Dashboard
    </a>
</div>

<div class="learning-container" style="justify-content: flex-start; padding-top: 2rem;">
    <div style="width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 1.5rem;">

        <!-- Large Text Input -->
        <textarea id="type-input" placeholder="Type anything here..."
            style="width: 100%; height: 200px; padding: 1.5rem; border-radius: 20px; border: 4px solid var(--color-highlight); font-size: 2rem; font-family: 'Inter', sans-serif; resize: none; outline: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></textarea>

        <!-- Action Buttons -->
        <div style="display: flex; gap: 1rem;">
            <button onclick="speakTypedText()"
                style="flex: 2; background: var(--color-highlight); color: white; border: none; padding: 1.5rem; border-radius: 16px; font-size: 1.5rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <span class="material-icons" style="font-size: 2rem;">volume_up</span>
                Speak
            </button>

            <button onclick="clearText()"
                style="flex: 1; background: #fee2e2; color: #ef4444; border: none; padding: 1.5rem; border-radius: 16px; font-size: 1.5rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                Clear
            </button>
        </div>

    </div>
</div>

<script>
    const input = document.getElementById('type-input');

    // Auto-focus on load
    input.focus();

    function speakTypedText() {
        const text = input.value.trim();
        if (text) {
            speak(text);
        }
    }

    function clearText() {
        input.value = '';
        input.focus();
    }

    // Speak on Enter key
    input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault(); // prevent new line
            speakTypedText();
        }
    });
</script>
{% endblock %}
